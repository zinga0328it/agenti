# Azione Fail2Ban dedicata al servizio MCP ALE.
#
# Perche' un'azione dedicata invece del default "nftables-multiport":
# durante la messa in sicurezza di core/mcp e' emerso che l'azione di
# default (banaction = nftables-multiport, usata dalle jail preesistenti)
# crea e popola una tabella/set DINAMICI ("f2b-table"/"addr-set-<name>"),
# completamente scollegati dai set STATICI realmente referenziati dal
# firewall in "chain banned" di /etc/nftables/core.conf (f2b-sshd,
# f2b-HONEYPOT-SCAN, f2b-apache-badbots, definiti in
# /etc/nftables/banned.conf). Il risultato osservato nei log reali
# (/var/log/fail2ban.log) e' che i ban su QUELLE jail preesistenti falliscono
# silenziosamente ("Error banning ...": "nft add element inet f2b-table ...
# Error: No such file or directory"), perche' "f2b-table" non esiste (viene
# distrutta dal "flush ruleset" con cui /etc/nftables/core.conf inizia ogni
# volta che nftables viene ricaricato).
#
# Per la jail mcp-ale NON riproduciamo questo bug: questa azione applica/
# rimuove elementi SOLO sul set statico "f2b-mcp-ale" gia' dichiarato in
# /etc/nftables/banned.conf e gia' referenziato da "chain mcp" in
# /etc/nftables/mcp.conf ("ip6 saddr @f2b-mcp-ale drop"). Nessun
# actionstart/chain/table dinamici: il set esiste sempre perche' fa parte
# della configurazione statica applicata da nftables.service al boot.
[Definition]
actionstart =
actionstop =
actioncheck = /usr/sbin/nft list set inet filter f2b-mcp-ale >/dev/null
actionban = /usr/sbin/nft add element inet filter f2b-mcp-ale { <ip> }
actionunban = /usr/sbin/nft delete element inet filter f2b-mcp-ale { <ip> }
actionflush = /usr/sbin/nft flush set inet filter f2b-mcp-ale
