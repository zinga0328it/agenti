# Filtro Fail2Ban per il servizio MCP ALE (core/mcp).
# Basato sul log REALE emesso da core/mcp/server/node_observability_server.py
# (vedi journalctl -u mcp-ale). Il backend systemd della jail (vedi
# jail.d/mcp-ale.local, stesso banaction/backend=systemd gia' usato dalle
# jail esistenti) precede il messaggio con timestamp/host/unit: il pattern
# usa un prefisso ".*" prima del testo utile, stesso stile gia' collaudato
# in filter.d/honeypot_scan.conf su questa macchina.
#
# Scatta SOLO per eventi reali: richieste rifiutate dal middleware di
# sicurezza del server (path sconosciuti/404, Content-Type non valido/400,
# JSON malformato/400, Host/Origin non validi/421). Non e' un'invenzione:
# ogni riga corrisponde a un evento realmente prodotto e osservato nel log
# (vedi journalctl -u mcp-ale).
[Definition]
failregex = MCP-ALE-REJECT SRC=<HOST> STATUS=(?:400|401|403|404|421) PATH=\S*\s*$
ignoreregex =
