chain mcp {
    # MCP ALE - server read-only (node/ollama/gpu status), SOLO su Yggdrasil.
    # Drop dei sorgenti bannati da Fail2Ban (jail dedicata mcp-ale, vedi
    # infra/fail2ban/jail.d/mcp-ale.local) PRIMA dell'accept: stesso schema
    # gia' usato da "chain banned" per gli altri servizi, qui autonomo nella
    # propria chain per non toccare "chain banned" (che resta invariata).
    ip6 saddr @f2b-mcp-ale drop

    # Accetta SOLO da ygg0 (Yggdrasil), mai da altre interfacce.
    iifname "ygg0" tcp dport 8811 accept
};
