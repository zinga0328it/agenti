# MCP ALE: nftables.service esegue "flush ruleset" ad ogni (ri)avvio,
# distruggendo i set dinamici usati da Fail2Ban (es. f2b-mcp-ale,
# f2b-sshd, ecc). L'ordinamento di boot gia' garantisce che nftables
# parta PRIMA di fail2ban (Before=fail2ban.service), ma se nftables
# viene ricaricato mentre il sistema e' gia' up (systemctl restart
# nftables), Fail2Ban non se ne accorge e i ban attivi restano fuori
# sync con il firewall reale.
#
# Questo ExecStartPost forza un resync automatico: ogni volta che
# nftables.service (ri)parte, viene schedulato un riavvio di Fail2Ban,
# che rilegge il proprio database SQLite persistente e re-inserisce i
# ban attivi nei set nftables appena ricreati (vuoti).
#
# IMPORTANTE: deve usare --no-block. fail2ban.service ha
# "After=nftables.service": se questo ExecStartPost chiamasse
# "systemctl try-restart" in modo SINCRONO (bloccante), si crea un
# deadlock nello scheduler di systemd, perche' il job di
# nftables.service non puo' considerarsi "avviato" finche'
# ExecStartPost non termina, e il job di fail2ban.service non puo'
# partire finche' il job di nftables.service non e' "avviato" (essendo
# After=). Verificato realmente il 2026-09-27: senza --no-block i due
# job restano bloccati a vicenda ("start running" / "start waiting")
# finche' non si cancellano manualmente con "systemctl cancel".
# Con --no-block il comando accoda il job di riavvio ed esce subito,
# lasciando che lo scheduler lo esegua non appena nftables.service e'
# diventato "active".
[Service]
ExecStartPost=/usr/bin/systemctl --no-block try-restart fail2ban.service
